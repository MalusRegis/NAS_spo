<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spode NAS</title>
<link rel="stylesheet" href="static/css/stylesheet.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1>Spode NAS<small id="conn"></small></h1>
    <button id="bSet">Settings</button>
  </header>

  <div class="bar">
    <nav class="crumbs" id="crumbs" aria-label="Current folder"></nav>
    <input class="search" id="q" type="search" placeholder="Filter this folder" aria-label="Filter this folder">
    <button id="bNew">New folder</button>
    <button id="bUp" class="pri">Upload</button>
    <input id="file" type="file" multiple hidden>
  </div>
  <div id="prog"><i></i></div>

  <div class="panel" id="drop">
    <table>
      <thead><tr>
        <th data-k="name">Name</th>
        <th data-k="type" class="hide-s" style="width:110px">Type</th>
        <th style="width:190px"></th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty" hidden></div>
  </div>
</div>

<dialog id="dSet">
  <h2>Connection</h2>
  <label for="sUrl">Server address (leave empty if this page is served by the API)</label>
  <input id="sUrl" type="text" placeholder="http://192.168.1.50:5000" autocomplete="off">
  <label for="sTok">API token (leave empty if login is disabled)</label>
  <input id="sTok" type="password" autocomplete="off">
  <div class="row"><button id="sCancel">Cancel</button><button id="sSave" class="pri">Save and reload</button></div>
</dialog>

<dialog id="dView">
  <h2 id="vTitle"></h2>
  <div id="view"></div>
  <div class="row"><button id="vDl">Download</button><button id="vClose" class="pri">Close</button></div>
</dialog>

<div id="toast" role="status"></div>

<script>
const $ = s => document.querySelector(s);
const ICON = {
  dir: '<svg class="ico dir" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5H9l2 2.5h8.5A1.5 1.5 0 0 1 21 9v8.5a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z"/></svg>',
  file: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M6 3h8l4 4v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v4h4"/></svg>',
  image: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M4 18l5-5 4 4 3-3 4 4"/></svg>'
};
let cfg = {}, cwd = '', items = [], sortK = 'name', sortDir = 1, viewing = null, viewUrl = null;

try { cfg = JSON.parse(localStorage.getItem('spode') || '{}'); } catch (e) {}
const saveCfg = () => { try { localStorage.setItem('spode', JSON.stringify(cfg)); } catch (e) {} };

const enc = p => p.split('/').filter(Boolean).map(encodeURIComponent).join('/');
const join = (a, b) => a ? a + '/' + b : b;
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function api(path, opt = {}) {
  const h = new Headers(opt.headers || {});
  if (cfg.token) h.set('Authorization', 'Bearer ' + cfg.token);
  return fetch((cfg.url || '').replace(/\/$/, '') + path, { ...opt, headers: h });
}
async function errMsg(r) {
  if (r.status === 401) { $('#dSet').showModal(); return 'Login failed. Check the API token.'; }
  try { return (await r.json()).error || ('Error ' + r.status); } catch (e) { return 'Error ' + r.status; }
}
let tt;
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 3200); }

/* ---------- browsing ---------- */
async function go(path) {
  try {
    const r = await api('/browse' + (path ? '/' + enc(path) : ''));
    if (!r.ok) { toast(await errMsg(r)); return; }
    const d = await r.json();
    if (d.is_file) { toast('That path is a file.'); return; }
    cwd = path;
    items = [
      ...d.folders.map(f => ({ ...f, dir: true, type: 'folder' })),
      ...d.files.map(f => ({ ...f, dir: false, type: f.file_type }))
    ];
    $('#conn').textContent = 'connected';
    $('#q').value = '';
    render();
  } catch (e) {
    $('#conn').textContent = 'offline';
    toast('Cannot reach the server. Check the address in Settings.');
  }
}

function crumbs() {
  const parts = cwd.split('/').filter(Boolean);
  let acc = '', h = parts.length ? '<button data-p="">Root</button>' : '<span class="cur">Root</span>';
  parts.forEach((p, i) => {
    acc = join(acc, p);
    h += '<span>/</span>' + (i === parts.length - 1 ? `<span class="cur">${esc(p)}</span>` : `<button data-p="${esc(acc)}">${esc(p)}</button>`);
  });
  $('#crumbs').innerHTML = h;
}

function render() {
  crumbs();
  const q = $('#q').value.trim().toLowerCase();
  const list = items.filter(i => !q || i.name.toLowerCase().includes(q)).sort((a, b) => {
    if (a.dir !== b.dir) return a.dir ? -1 : 1;
    const x = sortK === 'type' ? a.type + a.name.toLowerCase() : a.name.toLowerCase();
    const y = sortK === 'type' ? b.type + b.name.toLowerCase() : b.name.toLowerCase();
    return x < y ? -sortDir : x > y ? sortDir : 0;
  });
  view = list;
  $('#rows').innerHTML = list.map((it, i) => `
    <tr>
      <td><div class="name">${it.dir ? ICON.dir : it.file_type === 'image' ? ICON.image : ICON.file}
        <a data-i="${i}" data-a="open" tabindex="0" role="link">${esc(it.name)}</a></div></td>
      <td class="hide-s tag">${it.dir ? 'Folder' : it.file_type === 'image' ? 'Image' : it.file_type === 'document' ? 'Document' : (it.extension || 'File')}</td>
      <td><div class="acts">
        ${it.dir ? '' : `<button data-i="${i}" data-a="dl">Download</button>`}
        <button class="del" data-i="${i}" data-a="del">Delete</button></div></td>
    </tr>`).join('');
  const e = $('#empty');
  e.hidden = list.length > 0;
  e.textContent = q ? 'No items match the filter.' : 'This folder is empty. Upload files or drop them here.';
}
let view = [];

/* ---------- actions ---------- */
async function fetchBlob(path) {
  const r = await api('/download/' + enc(path));
  if (!r.ok) throw new Error(await errMsg(r));
  return r.blob();
}
async function download(it) {
  try {
    toast('Downloading ' + it.name + '...');
    const b = await fetchBlob(it.rel_path);
    const u = URL.createObjectURL(b), a = document.createElement('a');
    a.href = u; a.download = it.name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(u), 10000);
  } catch (e) { toast(e.message); }
}
async function preview(it) {
  const ext = it.extension, box = $('#view');
  const can = it.file_type === 'image' || ext === '.pdf' || ext === '.txt';
  if (!can) return download(it);
  try {
    const b = await fetchBlob(it.rel_path);
    if (viewUrl) URL.revokeObjectURL(viewUrl);
    viewUrl = URL.createObjectURL(b); viewing = it;
    $('#vTitle').textContent = it.name;
    if (it.file_type === 'image') box.innerHTML = `<img src="${viewUrl}" alt="${esc(it.name)}">`;
    else if (ext === '.pdf') box.innerHTML = `<iframe src="${viewUrl}" title="${esc(it.name)}"></iframe>`;
    else { const t = await b.text(); box.innerHTML = '<pre></pre>'; box.firstChild.textContent = t; }
    $('#dView').showModal();
  } catch (e) { toast(e.message); }
}
async function remove(it) {
  if (!confirm(`Delete ${it.dir ? 'folder' : 'file'} "${it.name}"? This cannot be undone.`)) return;
  const r = await api('/delete/' + enc(it.rel_path), { method: 'DELETE' });
  if (!r.ok) { toast(await errMsg(r)); return; }
  toast('Deleted ' + it.name); go(cwd);
}
async function newFolder() {
  const n = (prompt('Folder name') || '').trim();
  if (!n) return;
  if (/[\/\\]/.test(n)) { toast('Folder names cannot contain slashes.'); return; }
  const r = await api('/new_folder/' + enc(join(cwd, n)), { method: 'POST' });
  if (!r.ok) { toast(await errMsg(r)); return; }
  toast('Created ' + n); go(cwd);
}

function sendOne(file, overwrite, onProg) {
  return new Promise(res => {
    const x = new XMLHttpRequest();
    x.open('POST', (cfg.url || '').replace(/\/$/, '') + '/upload/' + enc(join(cwd, file.name)) + (overwrite ? '?overwrite=true' : ''));
    if (cfg.token) x.setRequestHeader('Authorization', 'Bearer ' + cfg.token);
    x.upload.onprogress = e => e.lengthComputable && onProg(e.loaded / e.total);
    x.onload = () => { let m = ''; try { m = JSON.parse(x.responseText).error || ''; } catch (e) {} res({ status: x.status, msg: m }); };
    x.onerror = () => res({ status: 0, msg: 'Network error' });
    const fd = new FormData(); fd.append('file', file);
    x.send(fd);
  });
}
async function upload(files) {
  const bar = $('#prog i'); let ok = 0;
  for (let i = 0; i < files.length; i++) {
    const f = files[i];
    const prog = p => bar.style.width = ((i + p) / files.length * 100) + '%';
    let r = await sendOne(f, false, prog);
    if (r.status === 409 && confirm(`"${f.name}" already exists. Replace it?`)) r = await sendOne(f, true, prog);
    if (r.status === 201) ok++;
    else if (r.status === 401) { $('#dSet').showModal(); break; }
    else if (r.status !== 409) toast(`${f.name}: ${r.msg || 'Upload failed'}`);
  }
  bar.style.width = '0';
  if (ok) toast(`Uploaded ${ok} file${ok > 1 ? 's' : ''}`);
  go(cwd);
}

/* ---------- wiring ---------- */
$('#crumbs').onclick = e => { const b = e.target.closest('button'); if (b) go(b.dataset.p); };
$('#rows').onclick = e => {
  const t = e.target.closest('[data-a]'); if (!t) return;
  const it = view[+t.dataset.i], a = t.dataset.a;
  if (a === 'open') it.dir ? go(it.rel_path) : preview(it);
  else if (a === 'dl') download(it);
  else if (a === 'del') remove(it);
};
$('#rows').onkeydown = e => { if (e.key === 'Enter' && e.target.dataset.a === 'open') e.target.click(); };
$('#q').oninput = render;
document.querySelectorAll('th[data-k]').forEach(th => th.onclick = () => {
  sortDir = sortK === th.dataset.k ? -sortDir : 1; sortK = th.dataset.k; render();
});
$('#bNew').onclick = newFolder;
$('#bUp').onclick = () => $('#file').click();
$('#file').onchange = e => { if (e.target.files.length) upload([...e.target.files]); e.target.value = ''; };

const drop = $('#drop');
['dragenter', 'dragover'].forEach(n => drop.addEventListener(n, e => { e.preventDefault(); drop.classList.add('drop'); }));
['dragleave', 'drop'].forEach(n => drop.addEventListener(n, e => { e.preventDefault(); drop.classList.remove('drop'); }));
drop.addEventListener('drop', e => { const f = [...e.dataTransfer.files]; if (f.length) upload(f); });

$('#bSet').onclick = () => { $('#sUrl').value = cfg.url || ''; $('#sTok').value = cfg.token || ''; $('#dSet').showModal(); };
$('#sCancel').onclick = () => $('#dSet').close();
$('#sSave').onclick = () => { cfg = { url: $('#sUrl').value.trim(), token: $('#sTok').value.trim() }; saveCfg(); $('#dSet').close(); go(''); };
$('#vClose').onclick = () => $('#dView').close();
$('#vDl').onclick = () => viewing && download(viewing);
$('#dView').addEventListener('close', () => { $('#view').innerHTML = ''; if (viewUrl) { URL.revokeObjectURL(viewUrl); viewUrl = null; } });

go('');
</script>
</body>
</html>
